name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only pushes cost Actions minutes and test nothing (LoanBook, 2026-10-15).
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

# A newer push supersedes a running one; no point finishing the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # addendum §2: off = the owner role (as every clone runs today); enforce = app_rw, NOBYPASSRLS. RLS is opt-in (D-23;
        # owner decision 2026-11-05): a clone runs the enforce leg once it sets the repo variable RLS_ENFORCE=1. The template always runs both.
        rls: ${{ fromJSON((github.repository == 'shanelabountyai/saas-foundation' || vars.RLS_ENFORCE == '1') && '["off","enforce"]' || '["off"]') }}
    env:
      # Ephemeral runner-local Postgres, gone when the job ends. Nothing here is a secret.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gavel_test?connection_limit=10&pool_timeout=20
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/gavel_test?connection_limit=10&pool_timeout=20
      AUTH_SECRET: ci-only-secret-not-for-real-use-0123456789abc
      APP_URL: http://localhost:6100
      GAVEL_BARRIER_N: '25' # O-10: 25 writers in CI, 50 locally
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: America/Chicago # a non-UTC server zone, like the laptop's, so the db timezone test can go red here
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: createdb gavel_test
      - id: migrate
        run: npx prisma migrate deploy
      - name: RLS enforce leg — app role, system URL
        if: matrix.rls == 'enforce'
        run: |
          db=${DATABASE_URL%%\?*}; db=${db##*/} # the job's own test DB name, so a clone's rename needs no edit here (F-14)
          psql -d "$db" -c "CREATE ROLE app_rw LOGIN PASSWORD 'app_rw' NOBYPASSRLS NOSUPERUSER;"
          psql -d "$db" -c "GRANT USAGE ON SCHEMA public TO app_rw; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_rw; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_rw;"
          echo "RLS_MODE=enforce" >> "$GITHUB_ENV"
          echo "DATABASE_URL_SYSTEM=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://app_rw:app_rw@localhost:5432/$db?connection_limit=8&pool_timeout=20" >> "$GITHUB_ENV"
      - run: npx vitest run
      # Production build, served — the way it ships. login.spec.ts drives a real page.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # Phase 3 gate (task 3.8): the ledger the vitest suite and the Playwright specs wrote must still fold
      # to its LotState rows and settlements. Runs even if a spec failed, so a verify red is never hidden.
      - run: npm run auction:verify
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}

  # Spec §4 / §13.3: the remaining module deleted by the manifest, and the tree must still generate, typecheck, build and pass drift.
  modules-removed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run foundation:check-modules
